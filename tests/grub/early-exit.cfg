# Negative self-test: GRUB resets the machine before any kernel runs.
# With QEMU -no-reboot the reset makes QEMU exit, which the runner must
# report as EARLY_EXIT, never PASS.
serial --unit=0 --speed=115200
terminal_input serial
terminal_output serial
set timeout=0
menuentry "early-exit selftest" {
    echo "SELFTEST early-exit: resetting before kernel"
    reboot
}
